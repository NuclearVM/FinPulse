services:
  timescaledb:
    image: timescale/timescaledb-ha:pg18
    container_name: timescaledb

    ports:
      - "127.0.0.1:5432:5432"

    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      PGDATA: /pgdata

    volumes:
      - ./timescaledb:/pgdata